<!DOCTYPE html>
<html>
<head>
    <title>New Company</title>
    <style>
        .form-container {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        /* Style the Django input boxes cleanly */
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-group {
            margin-top: 20px;
            text-align: center;
        }
        /* Fixed CSS buttons (removed structural bugs) */
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            display: inline-block;
        }
        .btn-primary {
            background-color: green; 
            color: white;
        }
        .btn-secondary {
            background-color: #f0f0f0; 
            color: black;
            border: 1px solid #ccc;
            text-decoration: none;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; font-family: Arial, sans-serif;">New Company</h1>
    
    <div class="form-container">
        <form method="POST">
            {% csrf_token %}
            
            <!-- Error Reporter Container -->
            {% if form.errors %}
                <div style="color: red; background-color: #ffe6e6; padding: 10px; border: 1px solid red; margin-bottom: 15px; border-radius: 4px; font-size: 14px;">
                    <strong>Please fix these fields:</strong>
                    {{ form.errors }}
                </div>
            {% endif %}
            
            <div class="form-group">
                <label>Company Name:</label>
                {{ form.c_name }}
            </div>
        
            <div class="form-group">
                <label>Phone Number:</label>
                {{ form.c_phone }}
            </div>
        
            <div class="form-group">
                <label>Email:</label>
                {{ form.c_email }}
            </div>
        
            <div class="form-group">
                <label>Address:</label>
                {{ form.address }}
            </div>
        
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Save Customer Details</button>
                <a href="{% url 'company_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
    
</body>
</html>
