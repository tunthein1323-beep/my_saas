<!DOCTYPE html>
<html>
<head>
    <title>Delete Customer</title>
</head>
<body>
    <h1>Are you sure you want to delete "{{ customer.first_name }} {{ customer.last_name }}"?</h1>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white; padding: 10px 20px; border: none; cursor: pointer;">
            Yes, Confirm Delete
        </button>
        <a href="{% url 'customer_list' customer.company.id %}" style="margin-left: 15px;">Cancel</a>
    </form>
</body>
</html>
