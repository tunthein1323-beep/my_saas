<!DOCTYPE html>
<html>
<head>
    <title>Company List</title>
</head>
<body>
    <h1>Company List</h1>
    <a href="{% url 'customer_create' company.pk %}" style="color: green;">Add New Customer</a>
    <a href="{% url 'company_list' %}" style="color: blueviolet; margin: 20px;">back</a>
    
    <!-- Added a temporary border so you can see if the table grid layout works -->
    <table border="1" style="margin-top: 20px; border-collapse: collapse; width: 100%;">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Phone Number</th>
                <th>Email</th>
                <th>Position</th>
                <th>Action</th>
            </tr>
        </thead>
        <!-- 🚨 FIXED: Removed the extra duplicate <thead> tag here -->
        <tbody>
            {% for customer in customers %}
            <tr class="clickable-row">
                <td><a href="{% url 'customer_update' customer.pk %}" style="text-decoration: none;"><strong>{{ customer.first_name }}</strong></a></td>
                <td><a href="{% url 'customer_update' customer.pk %}" style="text-decoration: none;">{{ customer.last_name }}</a></td>
                <td><a href="{% url 'customer_update' customer.pk %}" style="text-decoration: none;">{{ customer.phone  }}</a></td>
                <td><a href="{% url 'customer_update' customer.pk %}" style="text-decoration: none;">{{ customer.email  }}</a></td>
                <td><a href="{% url 'customer_update' customer.pk %}" style="text-decoration: none;">{{ customer.position  }}</a></td>
                <td>
                    <!-- 🚨 Pass customer.pk here! -->
                    <a href="{% url 'customer_update' customer.pk %}">Edit</a> | 
                    <a href="{% url 'customer_delete' customer.pk %}">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="6" style="text-align: center; padding: 10px;">No Customer found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
