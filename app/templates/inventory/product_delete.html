<!DOCTYPE html>
<html>
<head>
    <title>Delete Product</title>
</head>
<body>
    <h1>Are you sure you want to delete "{{ product.item_no }}"?</h1>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white; padding: 10px 20px; border: none; cursor: pointer;">
            Yes, Confirm Delete
        </button>
        <a href="{% url 'product_list' %}" style="margin-left: 15px;">Cancel</a>
    </form>
</body>
</html>
